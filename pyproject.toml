[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sca-timegraph"
version = "0.1.0"
description = "Selective Causal Adaptation (SCA) for Evolving Time-Series Causal Graphs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Suyesha" }
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "tigramite>=5.2.0",
]

[project.optional-dependencies]
benchmark = [
    "causalchamber==0.2.8",
]
dynamic-baselines = [
    "causal-learn>=0.1.3.8",
    "scikit-learn>=1.2.0",
    "joblib>=1.2.0",
    "ortools>=9.2",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src", "scripts", "tests"]
extraPaths = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
